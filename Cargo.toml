[package]
name = "muud-view"
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
description = "A fast, quiet image viewer for Windows"
license = "MIT"
repository = "https://github.com/recall2300/muud-view"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "clipboard",
    "default_fonts",
    "persistence",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
    "rayon",
] }
kamadak-exif = "0.6"
trash = "5"
serde = { version = "1", features = ["derive"] }
zune-jpeg = "0.5"
zune-core = "0.5"
bytemuck = "1"
ecolor = { version = "0.37", features = ["bytemuck"] }
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# zip/cbz archives (MIT), deflate only; CP949 (Korean) file names in them.
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
# SVG (Apache-2.0 OR MIT) and Photoshop composite images (MIT OR Apache-2.0).
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
psd = "0.3"
# libjpeg-turbo (TurboJPEG API), built from source and linked statically.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }
# ICC colour management (BSD-3-Clause OR Apache-2.0); already used by `image`.
moxcms = "0.8"

[target.'cfg(windows)'.dependencies]
rfd = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Speed check in CI: release optimisation without the slow fat-LTO link.
[profile.bench-ci]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false

# Decoders are the hot path; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

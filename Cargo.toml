[package]
name = "muud-view"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, quiet image viewer for Windows"
license = "MIT"
repository = "https://github.com/recall2300/muud-view"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "clipboard",
    "default_fonts",
    "persistence",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
    "rayon",
] }
kamadak-exif = "0.6"
trash = "5"
serde = { version = "1", features = ["derive"] }
zune-jpeg = "0.5"
zune-core = "0.5"
bytemuck = "1"
ecolor = { version = "0.37", features = ["bytemuck"] }
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# zip/cbz archives (MIT), deflate only; CP949 (Korean) file names in them.
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
# SVG (Apache-2.0 OR MIT) and Photoshop composite images (MIT OR Apache-2.0).
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
psd = "0.3"
# AVIF: rav1d (BSD-2-Clause), the Rust port of dav1d; its x86 assembly
# needs NASM, as libjpeg-turbo does. The container is read in core/avif.rs.
rav1d = { version = "1.1", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
# JPEG XL (MIT OR Apache-2.0), pure Rust; colours via moxcms, already used.
jxl-oxide = { version = "0.12", default-features = false, features = ["rayon", "moxcms"] }
# libjpeg-turbo (TurboJPEG API), built from source and linked statically.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }
# ICC colour management (BSD-3-Clause OR Apache-2.0); already used by `image`.
moxcms = "0.8"

[target.'cfg(windows)'.dependencies]
rfd = "0.18"
# COM interfaces for WIC (HEIC through Windows' own codecs); already in the
# tree through `trash`.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind (not abort): a crash inside a decoder on a broken file is caught
# and shown as an error for that file instead of closing the app.
strip = true

# Speed check in CI: release optimisation without the slow fat-LTO link.
[profile.bench-ci]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false

# Decoders are the hot path; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

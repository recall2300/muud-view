# `cargo deny check licenses bans sources` — run in CI.
# Only permissive licenses are allowed, so copyleft code (GPL, LGPL, ...) can never slip in.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# egui's built-in fallback fonts (used for symbols) include the Ubuntu font,
# whose licence allows free use and redistribution.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

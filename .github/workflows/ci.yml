name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    # libjpeg-turbo's C code is compiled with clang-cl (LLVM, on the
    # runner) through Ninja: MSVC's build decodes about 1.6x slower.
    env:
      CMAKE_GENERATOR: Ninja
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v4
      # Also registers problem matchers, so compiler errors show up as
      # annotations on the run (readable without signing in).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      # NASM: libjpeg-turbo's SIMD code (the build fails without it).
      - uses: ilammy/setup-nasm@v1
      - run: choco install ninja --no-progress -y
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # A failing test is also reported as an annotation on the run
      # (readable without signing in).
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --locked 2>&1 | tee test.log; then
            grep -E -A2 "panicked at|^test .* FAILED$" test.log | head -40 | sed 's/^/::error title=test failed::/'
            exit 1
          fi
      - run: cargo build --release --locked
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: muud-view-${{ github.sha }}-windows-x64
          path: target/release/muud-view.exe
          retention-days: 14

  speed:
    name: Speed (regression check)
    runs-on: windows-latest
    # libjpeg-turbo's C code with clang-cl (see the build job).
    env:
      CMAKE_GENERATOR: Ninja
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # NASM: libjpeg-turbo's SIMD code (the build fails without it).
      - uses: ilammy/setup-nasm@v1
      - run: choco install ninja --no-progress -y
      # Decode times divided by a calibration loop, compared with
      # bench/baseline.txt; fails if more than 30% slower. Results appear
      # as annotations and in the run summary.
      - run: cargo test --profile bench-ci --locked -- --ignored --nocapture bench_ci

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Also registers problem matchers, so compiler errors show up as
      # annotations on the run (readable without signing in).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: muud-view-${{ github.sha }}-windows-x64
          path: target/release/muud-view.exe
          retention-days: 14

  speed:
    name: Speed (regression check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Decode times divided by a calibration loop, compared with
      # bench/baseline.txt; fails if more than 30% slower. Results appear
      # as annotations and in the run summary.
      - run: cargo test --profile bench-ci --locked -- --ignored --nocapture bench_ci

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

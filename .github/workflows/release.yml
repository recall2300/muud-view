name: Release

# Releases happen by themselves: when a commit on main carries a version in
# Cargo.toml that has no tag yet (e.g. 0.5.0 and no v0.5.0), this workflow
# tests, builds and publishes it, creating the tag. Bump the version only
# when it is ready to ship.
#
# By hand, if ever needed:
#   - GitHub → Actions → Release → "Run workflow", enter a version like v0.1.0
#   - git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

# Never two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether this run publishes anything, and which version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          else
            v="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          fi
          release=true
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            release=false
            echo "$v is already released; nothing to do."
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release"

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check version
        shell: pwsh
        run: |
          if ("$env:VERSION" -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version must look like v1.2.3 (got '$env:VERSION')"
          }
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-deny

      - name: License policy
        run: cargo deny check licenses bans sources
      # A failing test is also reported as an annotation on the run
      # (readable without signing in).
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --release --locked 2>&1 | tee test.log; then
            grep -E -A2 "panicked at|^test .* FAILED$" test.log | head -40 | sed 's/^/::error title=test failed::/'
            exit 1
          fi
      - run: cargo build --release --locked

      - name: Third-party notices
        run: cargo about generate --fail about.hbs -o THIRD_PARTY_NOTICES.html

      - name: Package
        shell: pwsh
        run: |
          $v = "$env:VERSION"
          $name = "muud-view-$v-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/muud-view.exe "$name/"
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.html "$name/"
          Copy-Item assets/fonts/OFL-*.txt "$name/"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          Copy-Item target/release/muud-view.exe "$name.exe"
          Get-FileHash "$name.zip", "$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # scoop and winget manifests with this release's hash (see
      # docs/PACKAGING.md for submitting them).
      - name: Package manager manifests
        shell: pwsh
        run: python packaging/make_manifests.py "$env:VERSION" SHA256SUMS.txt manifests

      # Proves the files were built by this workflow from this commit.
      # Check with: gh attestation verify <file> --repo recall2300/muud-view
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            muud-view-*-windows-x64.zip
            muud-view-*-windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            muud-view-*-windows-x64.zip
            muud-view-*-windows-x64.exe
            SHA256SUMS.txt
            manifests/*
          generate_release_notes: true

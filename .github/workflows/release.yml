name: Release

# Two ways to publish a release:
#   1. GitHub → Actions → Release → "Run workflow", enter a version like v0.1.0
#   2. git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version
        shell: pwsh
        run: |
          if ("$env:VERSION" -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version must look like v1.2.3 (got '$env:VERSION')"
          }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-deny

      - name: License policy
        run: cargo deny check licenses bans sources
      - run: cargo test --release --locked
      - run: cargo build --release --locked

      - name: Third-party notices
        run: cargo about generate --fail about.hbs -o THIRD_PARTY_NOTICES.html

      - name: Package
        shell: pwsh
        run: |
          $v = "$env:VERSION"
          $name = "muud-view-$v-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/muud-view.exe "$name/"
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.html "$name/"
          Copy-Item assets/fonts/OFL-*.txt "$name/"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          Copy-Item target/release/muud-view.exe "$name.exe"
          Get-FileHash "$name.zip", "$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Proves the files were built by this workflow from this commit.
      # Check with: gh attestation verify <file> --repo recall2300/muud-view
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            muud-view-*-windows-x64.zip
            muud-view-*-windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            muud-view-*-windows-x64.zip
            muud-view-*-windows-x64.exe
            SHA256SUMS.txt
          generate_release_notes: true
